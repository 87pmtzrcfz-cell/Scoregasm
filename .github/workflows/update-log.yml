name: Update Scoregasm log

# Runs every night and when you press "Run workflow". It never runs on pull requests or other people's code.
on:
  schedule:
    - cron: "17 9 * * *"        # every day at 09:17 UTC (about 5:17 am Eastern), after the last West Coast games are final
    - cron: "17 16 * * *"       # backup run at 16:17 UTC (about 12:17 pm Eastern) in case the early run failed or ESPN was slow
  workflow_dispatch:             # lets you run it by hand from the Actions tab
    inputs:
      since:
        description: "Catch up from this date (YYYY-MM-DD). Leave empty to pick up where the log left off."
        required: false

# This job can read the repo and save its own log file. Nothing else.
permissions:
  contents: write

concurrency:
  group: update-log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Log finished games
        env:
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            if ! echo "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Date must look like 2026-10-21"; exit 1
            fi
            python update_log.py --since "$SINCE"
          else
            python update_log.py
          fi
      - name: Save the log
        run: |
          git config user.name "scoregasm-bot"
          git config user.email "scoregasm-bot@users.noreply.github.com"
          git add scoregasm_season.csv
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update season log"
            git pull --rebase --autostash
            git push
          fi
